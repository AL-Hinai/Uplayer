<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uplayer</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <a class="nav-brand" href="#/" aria-label="Uplayer home">
      <span class="brand-icon">▶</span>
      <span class="brand-name">Uplayer</span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="#/" class="nav-link" data-page="home">Home</a></li>
      <li><a href="#/movies" class="nav-link" data-page="movies">Movies</a></li>
      <li><a href="#/tv" class="nav-link" data-page="tv">TV Shows</a></li>
      <li><a href="#/search" class="nav-link" data-page="search">Search</a></li>
      <li><a href="#/recommendations" class="nav-link" data-page="recommendations">For You</a></li>
      <li><a href="#/history" class="nav-link" data-page="history">History</a></li>
      <li><a href="#/stream" class="nav-link" data-page="stream">▶ Stream</a></li>
    </ul>
    <div class="nav-actions">
      <div class="nav-search">
        <button class="nav-search-btn" id="navSearchBtn" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <input type="text" id="navSearchInput" placeholder="Search…" autocomplete="off" />
      </div>
      <button class="nav-icon-btn nav-cast-indicator" id="navCastIndicator" onclick="openCastFromNav(event)" title="Cast to TV" aria-label="Cast to TV">
        <svg class="cast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 10H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
          <path d="M17 10h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/>
          <path d="M5 10a5 5 0 0 1 5-5h4"/>
          <path d="M17 10a5 5 0 0 0-5-5"/>
          <circle cx="19" cy="19" r="2" fill="currentColor"/>
        </svg>
        <span class="cast-status-dot"></span>
        <span class="cast-device-name" id="castDeviceName"></span>
      </button>
      <button class="nav-icon-btn" id="navSettingsBtn" onclick="openSettingsModal()" title="Settings" aria-label="Settings">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" id="settingsModal" style="max-width:560px">
      <button class="modal-close" id="settingsClose" onclick="closeSettingsModal()" aria-label="Close">&times;</button>
      <div class="modal-content" id="settingsContent"></div>
    </div>
  </div>

  <!-- Main Content -->
  <main id="app" class="app-main">
    <div class="loading-screen" id="initialLoader">
      <div class="loader-brand">
        <span class="brand-icon large">▶</span>
        <span>Uplayer</span>
      </div>
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <div class="modal-overlay" id="castModalOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal cast-modal" id="castModal">
      <button class="modal-close" id="castModalClose" aria-label="Close">&times;</button>
      <div class="modal-content cast-modal-content" id="castModalContent"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Classic scripts in dependency order. Helpers first, app.js last (it references them). -->
  <script src="/js/next-episode.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
